name: documenso-test

services:
  database:
    image: mysql:8.4
    environment:
      - MYSQL_USER=documenso
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=documenso
      - MYSQL_ROOT_PASSWORD=password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-udocumenso', '-ppassword']
      interval: 1s
      timeout: 5s
      retries: 5
    ports:
      - 3307:3306

  inbucket:
    image: inbucket/inbucket
    ports:
      - 9000:9000
      - 2500:2500
      - 1100:1100

  documenso:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    depends_on:
      database:
        condition: service_healthy
      inbucket:
        condition: service_started
    env_file:
      - ../../.env.example
    environment:
      - NEXTAUTH_SECRET=secret
      - NEXT_PRIVATE_ENCRYPTION_KEY=CAFEBABE
      - NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=DEADBEEF
      - NEXT_PRIVATE_DATABASE_URL=mysql://documenso:password@database:3306/documenso
      - NEXT_PRIVATE_DIRECT_DATABASE_URL=mysql://documenso:password@database:3306/documenso
      - NEXT_PUBLIC_UPLOAD_TRANSPORT=database
      - NEXT_PRIVATE_SMTP_TRANSPORT=smtp-auth
      - NEXT_PRIVATE_SMTP_HOST=inbucket
      - NEXT_PRIVATE_SMTP_PORT=2500
      - NEXT_PRIVATE_SMTP_USERNAME=documenso
      - NEXT_PRIVATE_SMTP_PASSWORD=password
      - NEXT_PRIVATE_SMTP_FROM_NAME="No Reply @ Documenso"
      - NEXT_PRIVATE_SMTP_FROM_ADDRESS=noreply@documenso.com
      - NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH=/opt/documenso/cert.p12
    ports:
      - 3000:3000
    volumes:
      - ../../apps/remix/example/cert.p12:/opt/documenso/cert.p12
